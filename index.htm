<!DOCTYPE html>
<html>
<head>
    <title>Environmental Science Online Test</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background-color: #f4f6f7;
        }
        h1 {
            text-align: center;
        }
        .question {
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
        }
        #timer {
            font-size: 18px;
            color: red;
            text-align: right;
        }
    </style>
</head>
<body>

<h1>Environmental Science Test</h1>
<div id="timer">Time Left: 90:00</div>

<form id="quizForm">

<div class="question">
    <p>1. Define BOD.</p>
    <textarea name="q1" rows="3" cols="60"></textarea>
</div>

<div class="question">
    <p>2. What is photochemical smog?</p>
    <input type="radio" name="q2" value="a"> Reaction of sunlight with NOx and hydrocarbons<br>
    <input type="radio" name="q2" value="b"> Acid rain formation<br>
    <input type="radio" name="q2" value="c"> Ozone depletion<br>
</div>

<div class="question">
    <p>3. Calculate hardness if 50 mL sample used 12 mL of 0.01M EDTA.</p>
    <input type="text" name="q3">
</div>

<button type="button" onclick="submitQuiz()">Submit Test</button>

</form>

<script>
    // Timer
    var totalTime = 90 * 60; // 90 minutes
    var timerElement = document.getElementById("timer");

    var timer = setInterval(function() {
        var minutes = Math.floor(totalTime / 60);
        var seconds = totalTime % 60;
        timerElement.innerHTML = "Time Left: " + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
        totalTime--;

        if (totalTime < 0) {
            clearInterval(timer);
            alert("Time is up! Submitting test.");
            submitQuiz();
        }
    }, 1000);

    function submitQuiz() {
        var score = 0;
        var form = document.forms["quizForm"];

        // Q2 correct answer is option a
        if (form["q2"].value == "a") {
            score += 5;
        }

        alert("Test Submitted! Your score (objective part): " + score);
    }
</script>

</body>
</html>
